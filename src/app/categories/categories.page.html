<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>🏷️ Categorías</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-list *ngIf="categories.length > 0; else emptyState">
    <ion-item-sliding *ngFor="let cat of categories; trackBy: trackByCatId">

      <ion-item-options side="start">
        <ion-item-option color="primary" (click)="openEditAlert(cat)">
          <ion-icon slot="icon-only" name="pencil-outline"></ion-icon>
        </ion-item-option>
      </ion-item-options>

      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="deleteCategory(cat)">
          <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
        </ion-item-option>
      </ion-item-options>

      <ion-item>
        <div slot="start" class="color-dot" [style.background]="cat.color"></div>
        <ion-label>
          <h2>{{ cat.name }}</h2>
          <div class="color-palette">
            <span
              *ngFor="let color of colors"
              class="swatch"
              [style.background]="color"
              [class.active]="cat.color === color"
              (click)="changeColor(cat, color)">
            </span>
          </div>
        </ion-label>
      </ion-item>

    </ion-item-sliding>
  </ion-list>

  <ng-template #emptyState>
    <div class="empty-state">
      <ion-icon name="pricetags-outline"></ion-icon>
      <p>Sin categorías.<br/>Crea la primera con +</p>
    </div>
  </ng-template>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button color="primary" (click)="openAddAlert()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
